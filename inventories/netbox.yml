---
# AAP inventory source "NetLab Devices" (sourced from project).
# URL and token come from the "NetBox API" credential (NETBOX_API / NETBOX_TOKEN).
plugin: netbox.netbox.nb_inventory
validate_certs: false
config_context: false
interfaces: true
virtual_chassis_name: false
device_query_filters:
  - tag: netlab
group_by:
  - platforms
# ansible_connection / ansible_network_os are set in 06_configure_devices.yml
# from the NetBox platform (eos / ios).
