---
# NetLab execution environment (ansible-builder v3 schema).
#
# The supported AAP 2.6 EE plus what the NetLab playbooks need on top:
#   - netbox.netbox collection (modules, nb_lookup, nb_inventory)
#   - pynetbox and friends, which the netbox.netbox modules import
#
# The base image comes from the private automation hub that ships with AAP, so
# the build needs no registry.redhat.io login. Built and pushed back to the
# hub by playbooks/09_build_ee.yml (job "NetLab - Build Execution Environment"):
#
#   ansible-builder build -f ee/execution-environment.yml -t <hub>/netlab-ee:<tag>

version: 3

images:
  base_image:
    name: gateway.aap.ramzidev.com/ee-supported-rhel9:latest

dependencies:
  # ansible-core and ansible-runner are left out on purpose: the supported
  # base image already has the versions Red Hat supports, and listing them
  # here would make builder pip-install over them.
  galaxy: requirements.yml
  python: requirements.txt
  # builder gathers the Python requirements of every collection already in
  # the base image too; these ship pre-built in it and would otherwise be
  # recompiled from source (and fail: no systemd headers in the build stage).
  exclude:
    python:
      - systemd-python

options:
  # The RHEL 9 based AAP EEs ship microdnf, not dnf.
  package_manager_path: /usr/bin/microdnf
  tags:
    - netlab-ee:latest

additional_build_steps:
  append_final:
    - LABEL org.opencontainers.image.source="https://github.com/ramzihusein/netlab-automation"
    - LABEL org.opencontainers.image.description="AAP 2.6 supported EE + netbox.netbox and pynetbox for the NetLab demo"
