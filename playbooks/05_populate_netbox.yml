---
# Job Template: NetLab - Populate NetBox
# Purpose: Seeds NetBox with the lab (site, roles, platforms, devices,
#          interfaces, IPs, cables, VLANs, BGP sessions, config contexts) from
#          vars/netlab.yml for the nodes that are actually deployed, using the
#          netbox.netbox modules (runs in the "NetLab EE" execution
#          environment, which adds pynetbox). Lab objects are create-only, so
#          rerunning never overwrites changes made in NetBox, which is the
#          source of truth from here on.
#          Also proves NetBox -> device reachability.
#
# Required AAP Credential: "NetBox API" (netbox_url, netbox_token)

- name: NetLab — read deployed lab
  hosts: role_labhost
  gather_facts: false

  vars_files:
    - ../vars/netlab.yml

  tasks:
    - name: Load lab image state
      ansible.builtin.include_tasks: tasks/lab_state.yml


- name: NetLab — seed NetBox
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/netlab.yml

  vars:
    nodes: "{{ hostvars[groups['role_labhost'][0]].lab_active_nodes }}"
    links: "{{ hostvars[groups['role_labhost'][0]].lab_active_links }}"
    kind_of: "{{ dict(nodes | map(attribute='name') | zip(nodes | map(attribute='kind'))) }}"
    site_slug: netlab-aws
    kinds: "{{ nodes | map(attribute='kind') | unique | map('extract', os_kinds) | list }}"
    platform_names: {eos: Arista EOS, ios: Cisco IOS}
    lookup_args: {api_endpoint: "{{ netbox_url }}", token: "{{ netbox_token }}", validate_certs: false, raw_data: true}

  module_defaults:
    group/netbox.netbox.netbox:
      netbox_url: "{{ netbox_url }}"
      netbox_token: "{{ netbox_token }}"
      validate_certs: false
    ansible.builtin.uri:
      headers:
        Authorization: "Token {{ netbox_token }}"
        Accept: application/json
      body_format: json
      validate_certs: false

  tasks:

    # Seeding creates ~80 objects; with the EDA event rule live, each would
    # queue a Configure Devices job. Pause it here, re-enable at the end. (If
    # this run fails midway, the next Populate or Configure NetBox Webhook run
    # turns it back on.) netbox.netbox has no module for event rules.
    - name: Find the NetBox -> EDA event rule
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/extras/event-rules/?name={{ 'NetLab intent change' | urlencode }}"
      register: nb_event_rule

    - name: Pause the event rule while seeding
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/extras/event-rules/{{ nb_event_rule.json.results[0].id }}/"
        method: PATCH
        body: {enabled: false}
      when: nb_event_rule.json.count == 1 and nb_event_rule.json.results[0].enabled

    - name: Translate vars/netlab.yml into NetBox objects
      ansible.builtin.include_tasks: tasks/nb_seed_model.yml

    # ------------------------------------------------------- building blocks
    - name: Tags
      netbox.netbox.netbox_tag:
        data: "{{ item }}"
      loop:
        - {name: "{{ netlab_tag }}", slug: "{{ netlab_tag }}", color: 2196f3, description: Managed by AAP NetLab}
        - {name: acl-servers-in, slug: acl-servers-in, color: f44336, description: Bind ACL SERVERS-IN inbound (see config context NetLab - Security policy)}
        - {name: bgp-advertise, slug: bgp-advertise, color: 4caf50, description: Advertise this interface subnet in BGP}
        - {name: netlab-host, slug: netlab-host, color: 9e9e9e, description: NetLab Linux test host (not managed by AAP)}
      loop_control:
        label: "{{ item.name }}"

    - name: Site
      netbox.netbox.netbox_site:
        data:
          name: NetLab AWS
          slug: "{{ site_slug }}"
          status: active
          description: "containerlab on EC2 ({{ aws_region }})"
          tags: ["{{ netlab_tag }}"]

    - name: Device roles
      netbox.netbox.netbox_device_role:
        data: "{{ item }}"
      loop:
        - {name: Spine, slug: spine, color: 3f51b5}
        - {name: Leaf, slug: leaf, color: "009688"}
        - {name: Server, slug: server, color: "795548"}
      loop_control:
        label: "{{ item.name }}"

    - name: Manufacturers
      netbox.netbox.netbox_manufacturer:
        data:
          name: "{{ item }}"
      loop: "{{ kinds | map(attribute='manufacturer') | unique | list + ['Generic'] }}"

    - name: Device types
      netbox.netbox.netbox_device_type:
        data:
          model: "{{ item.device_type }}"
          slug: "{{ item.device_type | lower | regex_replace('[^a-z0-9]+', '-') }}"
          manufacturer: "{{ item.manufacturer }}"
      loop: "{{ kinds + [{'device_type': 'Linux container', 'manufacturer': 'Generic'}] }}"
      loop_control:
        label: "{{ item.device_type }}"

    - name: Platforms
      netbox.netbox.netbox_platform:
        data:
          name: "{{ platform_names[item.os] }}"
          slug: "{{ item.os }}"
          manufacturer: "{{ item.manufacturer }}"
      loop: "{{ kinds }}"
      loop_control:
        label: "{{ platform_names[item.os] }}"

    - name: RIR for private AS numbers
      netbox.netbox.netbox_rir:
        data:
          name: Private ASNs
          slug: private-asn
          is_private: true
          description: RFC 6996 private AS numbers

    - name: AS numbers
      netbox.netbox.netbox_asn:
        data:
          asn: "{{ item.asn }}"
          rir: private-asn
          description: "{{ item.role | title }} AS"
          tags: ["{{ netlab_tag }}"]
      loop: "{{ nodes | unique(attribute='asn') }}"
      loop_control:
        label: "AS{{ item.asn }}"

    # NetBox is the source of truth once seeded: lab objects that already
    # exist are skipped, so rerunning never undoes edits made in NetBox.
    # (The building blocks above - tags, site, roles, types, ASNs - are kept
    # in shape on every run; they also have to exist before NetBox accepts
    # them as filters here.)
    - name: Read what NetBox already has
      ansible.builtin.set_fact:
        have_devices: "{{ devices }}"
        have_interfaces: "{{ interfaces | map(attribute='device.name') | zip(interfaces | map(attribute='name')) | map('join', ' ') | list }}"
        have_cabled: "{{ interfaces | selectattr('cable') | map(attribute='device.name') | zip(interfaces | selectattr('cable') | map(attribute='name')) | map('join', ' ') | list }}"
        have_ips: "{{ query('netbox.netbox.nb_lookup', 'ip-addresses', **lookup_args) | map(attribute='address') | list }}"
        have_vlans: "{{ query('netbox.netbox.nb_lookup', 'vlans', api_filter='site=' ~ site_slug, **lookup_args) | map(attribute='vid') | list }}"
        have_prefixes: "{{ query('netbox.netbox.nb_lookup', 'prefixes', **lookup_args) | map(attribute='prefix') | list }}"
        have_contexts: "{{ query('netbox.netbox.nb_lookup', 'config-contexts', **lookup_args) | map(attribute='name') | list }}"
        have_sessions: "{{ query('netbox.netbox.nb_lookup', 'session', plugin='bgp', **lookup_args) | map(attribute='name') | list }}"
      vars:
        devices: "{{ query('netbox.netbox.nb_lookup', 'devices', api_filter='site=' ~ site_slug, **lookup_args) }}"
        interfaces: "{{ query('netbox.netbox.nb_lookup', 'interfaces', api_filter='site=' ~ site_slug, **lookup_args) }}"

    # ----------------------------------------------------------- lab objects
    - name: Server VLANs
      netbox.netbox.netbox_vlan:
        data:
          vid: "{{ item.vid }}"
          name: "{{ item.name }}"
          site: "{{ site_slug }}"
          status: active
          description: "{{ item.name }} servers on {{ item.leaf }}"
          tags: ["{{ netlab_tag }}"]
      loop: "{{ seed_vlans }}"
      loop_control:
        label: "VLAN {{ item.vid }} {{ item.name }}"
      when: item.vid not in have_vlans

    - name: Prefixes
      netbox.netbox.netbox_prefix:
        data: "{{ item | combine({'tags': [netlab_tag]}) }}"
      loop: "{{ seed_prefixes }}"
      loop_control:
        label: "{{ item.prefix }}"
      when: item.prefix not in have_prefixes

    # netbox.netbox has no module for IP ranges.
    - name: Look for the demo servers' address range
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/ipam/ip-ranges/?start_address={{ server_ip_range.start_address | ansible.utils.ipaddr('address') }}"
      register: server_range

    - name: Address range for the demo servers
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/ipam/ip-ranges/"
        method: POST
        body: "{{ server_ip_range | combine({'status': 'active', 'tags': [{'slug': netlab_tag}]}) }}"
        status_code: 201
      when: server_range.json.count == 0

    - name: Network devices
      netbox.netbox.netbox_device:
        data:
          name: "{{ item.name }}"
          device_role: "{{ item.role }}"
          device_type: "{{ os_kinds[item.kind].device_type }}"
          platform: "{{ item.os }}"
          site: "{{ site_slug }}"
          status: active
          comments: "containerlab kind {{ item.kind }}"
          tags: ["{{ netlab_tag }}"]
      loop: "{{ nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in have_devices | map(attribute='name')

    - name: Test hosts
      netbox.netbox.netbox_device:
        data:
          name: "{{ item.name }}"
          device_role: server
          device_type: Linux container
          site: "{{ site_slug }}"
          status: active
          comments: "containerlab linux node, VLAN {{ item.vid }} on {{ item.leaf }}"
          tags: [netlab-host]
      loop: "{{ seed_hosts }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in have_devices | map(attribute='name')

    - name: Interfaces
      netbox.netbox.netbox_device_interface:
        data: "{{ item }}"
      loop: "{{ seed_interfaces }}"
      loop_control:
        label: "{{ item.device }} {{ item.name }}"
      when: (item.device ~ ' ' ~ item.name) not in have_interfaces

    - name: IP addresses
      netbox.netbox.netbox_ip_address:
        data:
          address: "{{ item.address }}"
          status: active
          role: "{{ item.role | default(omit) }}"
          description: "{{ item.description | default(omit) }}"
          tags: "{{ item.tags }}"
          assigned_object:
            device: "{{ item.device }}"
            name: "{{ item.interface }}"
      loop: "{{ seed_ips }}"
      loop_control:
        label: "{{ item.address }} on {{ item.device }} {{ item.interface }}"
      when: item.address not in have_ips

    - name: Management IP as each device's primary IPv4 (if it has none)
      netbox.netbox.netbox_device:
        data:
          name: "{{ item.name }}"
          primary_ip4: "{{ item.mgmt_ip }}/{{ lab_mgmt_prefixlen }}"
      loop: "{{ nodes }}"
      loop_control:
        label: "{{ item.name }} {{ item.mgmt_ip }}"
      when: item.name not in have_devices | selectattr('primary_ip4') | map(attribute='name')

    - name: Cables
      netbox.netbox.netbox_cable:
        data:
          termination_a_type: dcim.interface
          termination_a: {device: "{{ item.a_device }}", name: "{{ item.a_if }}"}
          termination_b_type: dcim.interface
          termination_b: {device: "{{ item.b_device }}", name: "{{ item.b_if }}"}
          status: connected
          tags: "{{ item.tags }}"
      loop: "{{ seed_cables }}"
      loop_control:
        label: "{{ item.a_device }} {{ item.a_if }} <-> {{ item.b_device }} {{ item.b_if }}"
      when: (item.a_device ~ ' ' ~ item.a_if) not in have_cabled

    # ---------------------------------------------------------- BGP + policy
    # Sessions live in the netbox-bgp plugin, which netbox.netbox has no
    # module for, so these go to the plugin's REST API.
    - name: BGP sessions
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/plugins/bgp/session/"
        method: POST
        status_code: 201
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          device: {name: "{{ item.device }}"}
          site: {slug: "{{ site_slug }}"}
          status: active
          local_address: {address: "{{ item.local_address }}"}
          local_as: {asn: "{{ item.local_as }}"}
          remote_address: {address: "{{ item.remote_address }}"}
          remote_as: {asn: "{{ item.remote_as }}"}
          tags: [{slug: "{{ netlab_tag }}"}]
      changed_when: true
      loop: "{{ seed_sessions }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in have_sessions

    - name: Config contexts (services, security policy, routing)
      netbox.netbox.netbox_config_context:
        data:
          name: "{{ item.name }}"
          weight: "{{ item.weight }}"
          description: "{{ item.description }}"
          is_active: true
          tags: ["{{ netlab_tag }}"]
          data: "{{ item.data | to_json }}"
      loop: "{{ lab_config_contexts }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in have_contexts

    - name: Re-enable the event rule
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/extras/event-rules/{{ nb_event_rule.json.results[0].id }}/"
        method: PATCH
        body: {enabled: true}
      when: nb_event_rule.json.count == 1

    - name: Print NetBox summary
      ansible.builtin.debug:
        msg: >-
          NetBox has {{ query('netbox.netbox.nb_lookup', 'devices', api_filter='site=' ~ site_slug, **lookup_args) | length }}
          lab devices and {{ query('netbox.netbox.nb_lookup', 'session', plugin='bgp', **lookup_args) | length }}
          BGP sessions ({{ netbox_url }})


- name: NetLab — verify NetBox can reach the devices
  hosts: role_netbox
  gather_facts: false

  vars:
    nodes: "{{ hostvars[groups['role_labhost'][0]].lab_active_nodes }}"

  tasks:
    - name: Connect to each device mgmt IP from the NetBox host
      ansible.builtin.wait_for:
        host: "{{ item.mgmt_ip }}"
        port: 22
        search_regex: "^SSH-"
        timeout: 120
      loop: "{{ nodes }}"
      loop_control:
        label: "{{ item.name }} {{ item.mgmt_ip }}"
