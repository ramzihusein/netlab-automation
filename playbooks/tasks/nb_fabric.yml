---
# Seed the fabric design into NetBox (included by 05_populate_netbox.yml):
# BGP ASNs (custom field), server VLANs + prefixes, gateway interfaces (SVIs
# on EOS, 802.1Q subinterfaces on IOS), Linux test hosts with cables, and
# config contexts holding services + ACL policy. Create-only, like the rest of
# Populate: anything that already exists is left as people edited it.
#
# Uses from the including play: nodes, kind_of, site_slug, tag, nb_iface

- name: Fabric helpers
  ansible.builtin.set_fact:
    active_names: "{{ nodes | map(attribute='name') | list }}"
    fab_vlans: "{{ lab_vlans | selectattr('leaf', 'in', nodes | map(attribute='name') | list) | list }}"
    fab_hosts: "{{ lab_hosts | selectattr('leaf', 'in', nodes | map(attribute='name') | list) | list }}"
    os_of: "{{ dict(nodes | map(attribute='name') | zip(nodes | map(attribute='os'))) }}"

# ------------------------------------------------------------ tags + ASNs
- name: Ensure tags, the private-ASN RIR and one ASN per AS in the fabric
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_base_ops }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.endpoint }} {{ nb.lookup.values() | join(' ') }}"
  vars:
    fab_base_ops: >-
      {%- set out = [
        {'endpoint': 'extras/tags', 'lookup': {'slug': 'acl-servers-in'},
         'body': {'name': 'acl-servers-in', 'slug': 'acl-servers-in', 'color': 'f44336',
                  'description': 'Bind ACL SERVERS-IN inbound (see config context NetLab - Security policy)'}},
        {'endpoint': 'extras/tags', 'lookup': {'slug': 'bgp-advertise'},
         'body': {'name': 'bgp-advertise', 'slug': 'bgp-advertise', 'color': '4caf50',
                  'description': 'Advertise this interface subnet in BGP'}},
        {'endpoint': 'extras/tags', 'lookup': {'slug': 'netlab-host'},
         'body': {'name': 'netlab-host', 'slug': 'netlab-host', 'color': '9e9e9e', 'description': 'NetLab Linux test host (not managed by AAP)'}},
        {'endpoint': 'ipam/rirs', 'lookup': {'slug': 'private-asn'},
         'body': {'name': 'Private ASNs', 'slug': 'private-asn', 'is_private': true, 'description': 'RFC 6996 private AS numbers'}}] -%}
      {%- for asn in nodes | map(attribute='asn') | unique -%}
      {%-   set _ = out.append({'endpoint': 'ipam/asns', 'lookup': {'asn': asn},
              'body': {'asn': asn | int, 'rir': {'slug': 'private-asn'}, 'tags': tag,
                       'description': (nodes | selectattr('asn', 'equalto', asn) | map(attribute='role') | first) | title ~ ' AS'}}) -%}
      {%- endfor -%}{{ out }}

- name: Read lab devices
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/devices/?site={{ site_slug }}&limit=1000"
  register: fab_devices

# ------------------------------------------------------- VLANs + prefixes
- name: Ensure server VLANs
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_vlan_ops }}"
  loop_control:
    loop_var: nb
    label: "VLAN {{ nb.lookup.vid }}"
  vars:
    fab_vlan_ops: >-
      {%- set out = [] -%}{%- for v in fab_vlans -%}{%- set _ = out.append({
        'endpoint': 'ipam/vlans', 'lookup': {'vid': v.vid, 'site': site_slug}, 'update': false,
        'body': {'vid': v.vid, 'name': v.name, 'site': {'slug': site_slug}, 'status': 'active',
                 'description': v.name ~ ' servers on ' ~ v.leaf, 'tags': tag}}) -%}{%- endfor -%}{{ out }}

- name: Read lab VLANs
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/vlans/?site={{ site_slug }}&limit=1000"
  register: fab_vlan_list

- name: Index VLANs by VID
  ansible.builtin.set_fact:
    nb_vlan: "{{ dict(fab_vlan_list.json.results | map(attribute='vid') | zip(fab_vlan_list.json.results)) }}"

- name: Ensure prefixes (fabric pools + one per server VLAN)
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_prefix_ops }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.lookup.prefix }}"
  vars:
    fab_prefix_ops: >-
      {%- set out = [
        {'endpoint': 'ipam/prefixes', 'lookup': {'prefix': '192.168.254.0/24'}, 'update': false,
         'body': {'prefix': '192.168.254.0/24', 'status': 'container', 'description': 'Fabric point-to-point /31s', 'tags': tag}},
        {'endpoint': 'ipam/prefixes', 'lookup': {'prefix': '192.168.255.0/24'}, 'update': false,
         'body': {'prefix': '192.168.255.0/24', 'status': 'container', 'description': 'Loopbacks / router IDs', 'tags': tag}},
        {'endpoint': 'ipam/prefixes', 'lookup': {'prefix': '172.16.0.0/16'}, 'update': false,
         'body': {'prefix': '172.16.0.0/16', 'status': 'container', 'description': 'Server VLANs', 'tags': tag}}] -%}
      {%- for v in fab_vlans -%}{%- set net = v.gateway | ansible.utils.ipaddr('network/prefix') -%}{%- set _ = out.append({
        'endpoint': 'ipam/prefixes', 'lookup': {'prefix': net}, 'update': false,
        'body': {'prefix': net, 'status': 'active', 'vlan': nb_vlan[v.vid].id,
                 'description': v.name ~ ' (VLAN ' ~ v.vid ~ ')', 'tags': tag}}) -%}{%- endfor -%}{{ out }}

# ------------------------------------------------------ gateway interfaces
# Pass 1: host-facing leaf ports and EOS SVIs. Pass 2: IOS subinterfaces,
# which need their parent port's ID.
- name: Build host ports and SVIs
  ansible.builtin.set_fact:
    fab_if_pass1: >-
      {%- set out = [] -%}
      {%- for h in fab_hosts -%}
      {%-   set port = os_kinds[kind_of[h.leaf]].iface_prefix ~ (h.leaf_port + os_kinds[kind_of[h.leaf]].iface_offset) -%}
      {%-   set leaf_vlans = fab_vlans | selectattr('leaf', 'equalto', h.leaf) | map(attribute='vid') | list -%}
      {%-   set body = {'device': {'name': h.leaf}, 'name': port, 'type': '1000base-t',
                       'description': 'to ' ~ h.name ~ ' eth1', 'tags': tag} -%}
      {%-   if os_of[h.leaf] == 'eos' -%}
      {%-     set _ = body.update({'mode': 'access', 'untagged_vlan': nb_vlan[h.vid].id}) -%}
      {%-   else -%}
      {%-     set _ = body.update({'mode': 'tagged', 'tagged_vlans': leaf_vlans | map('extract', nb_vlan) | map(attribute='id') | list}) -%}
      {%-   endif -%}
      {%-   set _ = out.append({'endpoint': 'dcim/interfaces', 'lookup': {'device': h.leaf, 'name': port}, 'update': false, 'body': body}) -%}
      {%- endfor -%}
      {%- for v in fab_vlans if os_of[v.leaf] == 'eos' -%}
      {%-   set _ = out.append({'endpoint': 'dcim/interfaces', 'lookup': {'device': v.leaf, 'name': 'Vlan' ~ v.vid}, 'update': false,
             'body': {'device': {'name': v.leaf}, 'name': 'Vlan' ~ v.vid, 'type': 'virtual',
                      'description': v.name ~ ' gateway', 'tags': tag + [{'slug': 'acl-servers-in'}, {'slug': 'bgp-advertise'}]}}) -%}
      {%- endfor -%}
      {{ out }}

- name: Ensure host ports and SVIs
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_if_pass1 }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.lookup.device }} {{ nb.lookup.name }}"

- name: Re-read lab interfaces
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/interfaces/?site={{ site_slug }}&limit=1000"
  register: fab_if_list

- name: Re-index interfaces by device|name
  ansible.builtin.set_fact:
    nb_iface: "{{ dict(fab_if_list.json.results | map(attribute='device.name') | zip(fab_if_list.json.results | map(attribute='name')) | map('join', '|') | zip(fab_if_list.json.results)) }}"

- name: Ensure IOS gateway subinterfaces
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_if_pass2 }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.lookup.device }} {{ nb.lookup.name }}"
  vars:
    fab_if_pass2: >-
      {%- set out = [] -%}
      {%- for v in fab_vlans if os_of[v.leaf] == 'ios' -%}
      {%-   set h = fab_hosts | selectattr('leaf', 'equalto', v.leaf) | first -%}
      {%-   set port = os_kinds[kind_of[v.leaf]].iface_prefix ~ (h.leaf_port + os_kinds[kind_of[v.leaf]].iface_offset) -%}
      {%-   set _ = out.append({'endpoint': 'dcim/interfaces', 'lookup': {'device': v.leaf, 'name': port ~ '.' ~ v.vid}, 'update': false,
             'body': {'device': {'name': v.leaf}, 'name': port ~ '.' ~ v.vid, 'type': 'virtual',
                      'parent': nb_iface[v.leaf ~ '|' ~ port].id, 'mode': 'access', 'untagged_vlan': nb_vlan[v.vid].id,
                      'description': v.name ~ ' gateway', 'tags': tag + [{'slug': 'acl-servers-in'}, {'slug': 'bgp-advertise'}]}}) -%}
      {%- endfor -%}
      {{ out }}

# ------------------------------------------------------------ test hosts
- name: Ensure test host taxonomy and devices
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_host_ops }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.endpoint }} {{ nb.lookup.values() | join(' ') }}"
  vars:
    fab_host_ops: >-
      {%- set out = [
        {'endpoint': 'dcim/manufacturers', 'lookup': {'slug': 'generic'}, 'body': {'name': 'Generic', 'slug': 'generic'}},
        {'endpoint': 'dcim/device-types', 'lookup': {'slug': 'linux-container'},
         'body': {'manufacturer': {'slug': 'generic'}, 'model': 'Linux container', 'slug': 'linux-container'}},
        {'endpoint': 'dcim/device-roles', 'lookup': {'slug': 'server'}, 'body': {'name': 'Server', 'slug': 'server', 'color': '795548'}}] -%}
      {%- for h in fab_hosts -%}{%- set _ = out.append(
        {'endpoint': 'dcim/devices', 'lookup': {'name': h.name}, 'update': false,
         'body': {'name': h.name, 'role': {'slug': 'server'}, 'device_type': {'slug': 'linux-container'},
                  'site': {'slug': site_slug}, 'status': 'active', 'tags': [{'slug': 'netlab-host'}],
                  'comments': 'containerlab linux node, VLAN ' ~ h.vid ~ ' on ' ~ h.leaf}}) -%}{%- set _ = out.append(
        {'endpoint': 'dcim/interfaces', 'lookup': {'device': h.name, 'name': 'eth1'}, 'update': false,
         'body': {'device': {'name': h.name}, 'name': 'eth1', 'type': '1000base-t', 'tags': [{'slug': 'netlab-host'}]}}) -%}{%- endfor -%}
      {{ out }}

- name: Re-read interfaces including hosts
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/interfaces/?site={{ site_slug }}&limit=1000"
  register: fab_if_list

- name: Re-index interfaces by device|name
  ansible.builtin.set_fact:
    nb_iface: "{{ dict(fab_if_list.json.results | map(attribute='device.name') | zip(fab_if_list.json.results | map(attribute='name')) | map('join', '|') | zip(fab_if_list.json.results)) }}"

# ------------------------------------------------------- addresses + cables
- name: Ensure gateway and host IPs
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_ip_ops }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.lookup.address }}"
  vars:
    fab_ip_ops: >-
      {%- set out = [] -%}
      {%- for v in fab_vlans -%}
      {%-   if os_of[v.leaf] == 'eos' -%}{%- set ifname = 'Vlan' ~ v.vid -%}
      {%-   else -%}{%- set h = fab_hosts | selectattr('leaf', 'equalto', v.leaf) | first -%}
      {%-     set ifname = os_kinds[kind_of[v.leaf]].iface_prefix ~ (h.leaf_port + os_kinds[kind_of[v.leaf]].iface_offset) ~ '.' ~ v.vid -%}{%- endif -%}
      {%-   set _ = out.append({'endpoint': 'ipam/ip-addresses', 'lookup': {'address': v.gateway}, 'update': false,
             'body': {'address': v.gateway, 'status': 'active',
                      'description': v.name ~ ' gateway', 'tags': tag,
                      'assigned_object_type': 'dcim.interface', 'assigned_object_id': nb_iface[v.leaf ~ '|' ~ ifname].id}}) -%}
      {%- endfor -%}
      {%- for h in fab_hosts -%}
      {%-   set _ = out.append({'endpoint': 'ipam/ip-addresses', 'lookup': {'address': h.ip}, 'update': false,
             'body': {'address': h.ip, 'status': 'active', 'description': h.name ~ ' (VLAN ' ~ h.vid ~ ')',
                      'tags': [{'slug': 'netlab-host'}],
                      'assigned_object_type': 'dcim.interface', 'assigned_object_id': nb_iface[h.name ~ '|eth1'].id}}) -%}
      {%- endfor -%}
      {{ out }}

- name: Cable test hosts to their leaf (skip if already cabled)
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/cables/"
    method: POST
    status_code: 201
    body:
      status: connected
      tags: [{slug: netlab-host}]
      a_terminations: [{object_type: dcim.interface, object_id: "{{ nb_iface[item.leaf ~ '|' ~ port].id }}"}]
      b_terminations: [{object_type: dcim.interface, object_id: "{{ nb_iface[item.name ~ '|eth1'].id }}"}]
  changed_when: true
  when: nb_iface[item.name ~ '|eth1'].cable is none
  loop: "{{ fab_hosts }}"
  loop_control:
    label: "{{ item.leaf }}:{{ port }} <-> {{ item.name }}:eth1"
  vars:
    port: "{{ os_kinds[kind_of[item.leaf]].iface_prefix ~ (item.leaf_port + os_kinds[kind_of[item.leaf]].iface_offset) }}"

# ----------------------------------------------------------- BGP sessions
# Loopbacks (router IDs) are advertised too; tag any that predate the tag.
- name: Tag loopbacks and gateways for BGP advertisement (where missing)
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/dcim/interfaces/{{ item.id }}/"
    method: PATCH
    body:
      tags: "{{ item.tags | map(attribute='slug') | map('regex_replace', '^', '{\"slug\": \"') | map('regex_replace', '$', '\"}') | map('from_json') | list + [{'slug': 'bgp-advertise'}] }}"
  changed_when: true
  when: "'bgp-advertise' not in (item.tags | map(attribute='slug') | list)"
  loop: >-
    {{ fab_if_list.json.results | selectattr('device.name', 'in', active_names)
       | selectattr('name', 'equalto', 'Loopback0') | list
       + fab_if_list.json.results | selectattr('device.name', 'in', active_names)
       | selectattr('tags', 'defined') | selectattr('name', 'search', '^Vlan|[.]') | list }}
  loop_control:
    label: "{{ item.device.name }} {{ item.name }}"

- name: Read fabric IPs and ASNs
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/{{ item }}"
  loop:
    - "ipam/ip-addresses/?tag={{ netlab_tag }}&limit=1000"
    - "ipam/asns/?limit=1000"
  register: fab_lookups

- name: Ensure one BGP session per side of every fabric link
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_session_ops }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.lookup.name }}"
  vars:
    ip_id: "{{ dict(fab_lookups.results[0].json.results | map(attribute='address') | zip(fab_lookups.results[0].json.results | map(attribute='id'))) }}"
    asn_id: "{{ dict(fab_lookups.results[1].json.results | map(attribute='asn') | zip(fab_lookups.results[1].json.results | map(attribute='id'))) }}"
    asn_of: "{{ dict(nodes | map(attribute='name') | zip(nodes | map(attribute='asn'))) }}"
    fab_session_ops: >-
      {%- set out = [] -%}
      {%- for l in links -%}
      {%-   set a_if = os_kinds[kind_of[l.a]].iface_prefix ~ (l.a_port + os_kinds[kind_of[l.a]].iface_offset) -%}
      {%-   set b_if = os_kinds[kind_of[l.b]].iface_prefix ~ (l.b_port + os_kinds[kind_of[l.b]].iface_offset) -%}
      {%-   for me, my_if, my_ip, peer, peer_if, peer_ip in [(l.a, a_if, l.a_ip, l.b, b_if, l.b_ip), (l.b, b_if, l.b_ip, l.a, a_if, l.a_ip)] -%}
      {%-     set _ = out.append({'endpoint': 'plugins/bgp/session', 'lookup': {'name': me ~ ' to ' ~ peer}, 'update': false,
              'body': {'name': me ~ ' to ' ~ peer, 'description': peer ~ ':' ~ peer_if,
                       'device': {'name': me}, 'site': {'slug': site_slug}, 'status': 'active', 'tags': tag,
                       'local_address': ip_id[my_ip], 'local_as': asn_id[asn_of[me]],
                       'remote_address': ip_id[peer_ip], 'remote_as': asn_id[asn_of[peer]]}}) -%}
      {%-   endfor -%}
      {%- endfor -%}{{ out }}

# -------------------------------------------------------- config contexts
- name: Ensure config contexts (services + security policy)
  ansible.builtin.include_tasks: nb_ensure.yml
  loop: "{{ fab_cc_ops }}"
  loop_control:
    loop_var: nb
    label: "{{ nb.lookup.name }}"
  vars:
    fab_cc_ops: >-
      {%- set out = [] -%}{%- for c in lab_config_contexts -%}{%- set _ = out.append(
        {'endpoint': 'extras/config-contexts', 'lookup': {'name': c.name}, 'update': false,
         'body': {'name': c.name, 'weight': c.weight, 'description': c.description,
                  'is_active': true, 'tags': [netlab_tag], 'data': c.data}}) -%}{%- endfor -%}{{ out }}
