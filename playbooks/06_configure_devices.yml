---
# Job Templates: NetLab - Configure Devices     (job type run)
#                NetLab - Check Config Drift    (same playbook, check + diff)
#
# Renders each device's full intent from NetBox and enforces it with vendor
# resource modules (state replaced), so the device ends up exactly as NetBox
# says, and a check-mode run lists every difference without touching it:
#   - hostname, DNS, SNMP, LLDP, NTP, syslog, login banner  (config context)
#   - interfaces: description, enabled, L2 access/trunk or L3, VLAN
#     subinterfaces, IPv4                                     (interfaces/IPs)
#   - VLANs (EOS)                                             (VLANs on ports/SVIs)
#   - ACLs, and their bindings by interface tag              (config context)
#   - eBGP: ASN (device custom field bgp_asn); neighbors derived from NetBox
#     cables + the peer's /31; advertises loopback + server subnets
#
# Scope: extra var changed_device=<name> (sent by EDA) configures that device
# plus its cabled BGP neighbors; without it every device is configured.
# Inventory: "NetLab Devices" (NetBox, update on launch).

- name: NetLab — push NetBox intent to devices
  hosts: all
  gather_facts: false

  # Derived from the NetBox platform here rather than via inventory 'compose',
  # which the AAP inventory import doesn't persist.
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: "{{ 'arista.eos.eos' if (platforms | first) == 'eos' else 'cisco.ios.ios' }}"
    # The EOS cliconf plugin needs 'enable' before config mode (no enable secret on cEOS).
    ansible_become: "{{ (platforms | first) == 'eos' }}"
    ansible_become_method: ansible.netcommon.enable

  tasks:

    # Scope is computed inside this play (not a localhost play): EDA launches
    # with limit=all, which excludes the implicit localhost.
    - name: Work out the blast radius from NetBox cabling
      ansible.builtin.set_fact:
        nb_targets: >-
          {{ ansible_play_hosts_all if not changed_device else
             ([changed_device] + (hostvars[changed_device].interfaces | default([])
               | map(attribute='link_peers') | flatten | map(attribute='device.name') | list
               if changed_device in hostvars else []))
             | select('in', ansible_play_hosts_all) | unique | list }}
      run_once: true
      vars:
        changed_device: "{{ changed_device | default('') }}"

    - name: Show scope
      ansible.builtin.debug:
        msg: "{{ ('Change on ' ~ changed_device ~ ' -> ') if changed_device | default('') else 'Full run -> ' }}{{ nb_targets | join(', ') or 'nothing in inventory' }}"
      run_once: true

    - name: Skip devices outside the blast radius
      ansible.builtin.meta: end_host
      when: inventory_hostname not in nb_targets

    # ------------------------------------------------------- NetBox data
    # A url lookup runs on the controller, so this works even when a --limit
    # skips the localhost play above.
    - name: Read VLAN names from NetBox
      ansible.builtin.set_fact:
        nb_vlan_list: >-
          {{ (lookup('ansible.builtin.url', netbox_url ~ '/api/ipam/vlans/?limit=1000', validate_certs=false,
                     headers={'Authorization': 'Token ' ~ netbox_token, 'Accept': 'application/json'},
                     split_lines=false) | from_json).results }}
      run_once: true

    - name: Render intent from NetBox
      ansible.builtin.set_fact:
        cc: "{{ (config_context | default([{}]) | first) if config_context is not mapping else config_context }}"
        nb_ifaces: "{{ interfaces | default([]) | rejectattr('mgmt_only') | list }}"
        vlan_name: "{{ dict(_vl | map(attribute='vid') | zip(_vl | map(attribute='name'))) }}"
        my_asn: "{{ custom_fields.bgp_asn | default(none) }}"
      vars:
        _vl: "{{ nb_vlan_list }}"

    - name: Render interfaces, VLANs, BGP and ACL bindings
      ansible.builtin.set_fact:
        intent: >-
          {%- set ifs = [] -%}{%- set l3 = [] -%}{%- set l2 = [] -%}{%- set vids = [] -%}
          {%- set nbrs = [] -%}{%- set nets = [] -%}{%- set subs = [] -%}{%- set binds = [] -%}
          {%- set rid = [] -%}
          {%- for i in nb_ifaces -%}
          {%-   set v4 = i.ip_addresses | default([]) | selectattr('family.value', 'equalto', 4) | map(attribute='address') | list -%}
          {%-   set is_l2 = i.mode is not none and '.' not in i.name and not i.name.startswith('Vlan') -%}
          {%-   set _ = ifs.append({'name': i.name, 'enabled': i.enabled, 'description': i.description, 'l2': is_l2}) -%}
          {%-   if is_l2 -%}
          {%-     set _ = l2.append({'name': i.name, 'mode': (i.mode.value if i.mode is mapping else i.mode),
                                      'access_vlan': (i.untagged_vlan.vid if i.untagged_vlan else none),
                                      'trunk_vlans': i.tagged_vlans | map(attribute='vid') | list}) -%}
          {%-     set _ = vids.extend(([i.untagged_vlan.vid] if i.untagged_vlan else []) + (i.tagged_vlans | map(attribute='vid') | list)) -%}
          {%-   else -%}
          {%-     set _ = l3.append({'name': i.name, 'ipv4': v4}) -%}
          {%-   endif -%}
          {%-   if i.name.startswith('Vlan') -%}{%- set _ = vids.append(i.name[4:] | int) -%}{%- endif -%}
          {%-   if '.' in i.name and i.untagged_vlan -%}{%- set _ = subs.append({'name': i.name, 'vid': i.untagged_vlan.vid}) -%}{%- endif -%}
          {%-   if i.name == 'Loopback0' and v4 -%}{%- set _ = rid.append(v4[0].split('/')[0]) -%}{%- endif -%}
          {%-   set peers = i.link_peers | default([]) | selectattr('device.name', 'in', groups['all']) | list -%}
          {%-   if peers and v4 -%}
          {%-     set p = peers[0] -%}
          {%-     set pif = hostvars[p.device.name].interfaces | selectattr('name', 'equalto', p.name) | list -%}
          {%-     set pv4 = (pif[0].ip_addresses | default([]) | selectattr('family.value', 'equalto', 4) | map(attribute='address') | list) if pif else [] -%}
          {%-     set pas = hostvars[p.device.name].custom_fields.bgp_asn | default(none) -%}
          {%-     if pv4 and pas -%}
          {%-       set _ = nbrs.append({'ip': pv4[0].split('/')[0], 'asn': pas | string,
                                         'description': p.device.name ~ ':' ~ p.name}) -%}
          {%-     endif -%}
          {%-   elif v4 -%}
          {%-     set _ = nets.extend(v4 | map('ansible.utils.ipaddr', 'network/prefix') | list) -%}
          {%-   endif -%}
          {%-   for b in cc.acl_bindings | default([]) if b.tag in (i.tags | default([])) -%}
          {%-     set _ = binds.append({'name': i.name, 'acl': b.acl, 'direction': b.direction}) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ {'ifs': ifs, 'l3': l3, 'l2': l2, 'vlans': vids | unique | sort,
              'subifs': subs, 'bgp_neighbors': nbrs, 'bgp_networks': nets | unique | sort,
              'router_id': rid | first | default(none), 'acl_bindings': binds} }}

    - name: Show intent
      ansible.builtin.debug:
        msg:
          - "ASN {{ my_asn }}  router-id {{ intent.router_id }}"
          - "BGP neighbors: {{ intent.bgp_neighbors | map(attribute='description') | join(', ') or '-' }}"
          - "BGP networks:  {{ intent.bgp_networks | join(', ') or '-' }}"
          - "VLANs: {{ intent.vlans | join(', ') or '-' }}   ACL bindings: {{ intent.acl_bindings | map(attribute='name') | join(', ') or '-' }}"

    # ---------------------------------------------------------- vendor push
    - name: Configure device for its platform
      ansible.builtin.include_tasks: "tasks/configure_{{ platforms | first }}.yml"

    - name: Summarize
      ansible.builtin.debug:
        msg: >-
          {{ ('DRIFT in: ' if ansible_check_mode else 'Changed: ') ~ (changed_areas | join(', '))
             if changed_areas else ('In sync with NetBox' if ansible_check_mode else 'Already matched NetBox') }}
      vars:
        changed_areas: >-
          {{ areas | dict2items | selectattr('value.changed', 'defined')
             | selectattr('value.changed') | map(attribute='key') | list }}
        areas:
          base: "{{ r_base | default({}) }}"
          ntp: "{{ r_ntp | default({}) }}"
          syslog: "{{ r_syslog | default({}) }}"
          banner: "{{ r_banner | default({}) }}"
          vlans: "{{ r_vlans | default({}) }}"
          interfaces: "{{ r_interfaces | default({}) }}"
          switchports: "{{ r_l2 | default({}) }}"
          subinterfaces: "{{ r_subifs | default({}) }}"
          ip_addresses: "{{ r_l3 | default({}) }}"
          acls: "{{ r_acls | default({}) }}"
          acl_bindings: "{{ r_acl_bind | default({}) }}"
          bgp: "{{ r_bgp | default({}) }}"
          bgp_networks: "{{ r_bgp_af | default({}) }}"
