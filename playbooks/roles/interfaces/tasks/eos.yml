---
- name: Descriptions, state and routed/switched mode (Arista)
  arista.eos.eos_interfaces:
    config: "{{ lookup('ansible.builtin.template', 'eos_interfaces.yml.j2') | from_yaml }}"
    state: replaced
  register: r_interfaces

- name: Access and trunk ports (Arista)
  arista.eos.eos_l2_interfaces:
    config: "{{ switchports }}"
    state: replaced
  vars:
    switchports: "{{ lookup('ansible.builtin.template', 'eos_switchports.yml.j2') | from_yaml or [] }}"
  when: switchports | length > 0
  register: r_switchports

- name: IPv4 addresses (Arista)
  arista.eos.eos_l3_interfaces:
    config: "{{ lookup('ansible.builtin.template', 'ip_addresses.yml.j2') | from_yaml }}"
    state: replaced
  register: r_ip_addresses

# A VLAN interface on Arista stays down until a port in that VLAN is up, so a
# new server VLAN (no servers cabled yet) would have no connected route and
# BGP wouldn't advertise it. Gateways stay up regardless.
- name: Keep gateway VLAN interfaces up (Arista)
  arista.eos.eos_config:
    lines: no autostate
    parents: "interface {{ item }}"
  loop: "{{ interfaces | map(attribute='name') | select('match', 'Vlan') | list }}"
  register: r_gateway_state

# Deleting a gateway in NetBox should delete it on the device too.
- name: Read the VLAN interfaces on the device (Arista)
  arista.eos.eos_command:
    commands: show running-config | include ^interface Vlan
  register: device_vlan_interfaces
  check_mode: false

- name: Remove VLAN interfaces that are no longer in NetBox (Arista)
  arista.eos.eos_config:
    lines: "no interface {{ item }}"
  loop: >-
    {{ device_vlan_interfaces.stdout[0].splitlines() | map('replace', 'interface ', '') | map('trim')
       | select | reject('in', interfaces | map(attribute='name')) | list }}
  register: r_removed_interfaces
