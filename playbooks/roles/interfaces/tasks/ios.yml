---
- name: Descriptions and state (Cisco)
  cisco.ios.ios_interfaces:
    config: "{{ lookup('ansible.builtin.template', 'ios_interfaces.yml.j2') | from_yaml }}"
    state: replaced
  register: r_interfaces

# IOS needs the 802.1Q tag on a subinterface before it accepts an IP address
- name: VLAN subinterfaces get their 802.1Q tag (Cisco)
  cisco.ios.ios_config:
    parents: "interface {{ item.name }}"
    lines: "encapsulation dot1Q {{ item.untagged_vlan.vid }}"
  loop: "{{ interfaces | selectattr('name', 'search', '[.]') | selectattr('untagged_vlan') | list }}"
  loop_control:
    label: "{{ item.name }} -> VLAN {{ item.untagged_vlan.vid }}"
  register: r_subinterfaces

- name: IPv4 addresses (Cisco)
  cisco.ios.ios_l3_interfaces:
    config: "{{ lookup('ansible.builtin.template', 'ip_addresses.yml.j2') | from_yaml }}"
    state: replaced
  register: r_ip_addresses
