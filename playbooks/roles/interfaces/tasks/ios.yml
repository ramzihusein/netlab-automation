---
- name: Descriptions and state (Cisco)
  cisco.ios.ios_interfaces:
    config: "{{ lookup('ansible.builtin.template', 'ios_interfaces.yml.j2') | from_yaml }}"
    state: replaced
  register: r_interfaces

# IOS needs the 802.1Q tag on a subinterface before it accepts an IP address
- name: VLAN subinterfaces get their 802.1Q tag (Cisco)
  cisco.ios.ios_config:
    parents: "interface {{ item.name }}"
    lines: "encapsulation dot1Q {{ item.untagged_vlan.vid }}"
  loop: "{{ interfaces | selectattr('name', 'search', '[.]') | selectattr('untagged_vlan') | list }}"
  loop_control:
    label: "{{ item.name }} -> VLAN {{ item.untagged_vlan.vid }}"
  register: r_subinterfaces

- name: IPv4 addresses (Cisco)
  cisco.ios.ios_l3_interfaces:
    config: "{{ lookup('ansible.builtin.template', 'ip_addresses.yml.j2') | from_yaml }}"
    state: replaced
  register: r_ip_addresses

# Deleting a gateway in NetBox should delete it on the device too.
- name: Read the VLAN subinterfaces on the device (Cisco)
  cisco.ios.ios_command:
    commands: show running-config | include ^interface .+[.]
  register: device_subinterfaces
  check_mode: false

- name: Remove VLAN subinterfaces that are no longer in NetBox (Cisco)
  cisco.ios.ios_config:
    lines: "no interface {{ item }}"
  loop: >-
    {{ device_subinterfaces.stdout[0].splitlines() | map('replace', 'interface ', '') | map('trim')
       | select | reject('in', interfaces | map(attribute='name')) | list }}
  register: r_removed_interfaces
