---
# Is the fabric healthy? Checked against NetBox, the source of truth:
#   - every Active BGP session in NetBox is Established on the device
#   - every device reaches every other device's loopback (sourced from its own)
#   - with check_new_vlan: the spines have a route to the new VLAN's subnet
# Retries for a minute so it can run straight after a change.

- name: Read this device's BGP sessions from NetBox
  ansible.builtin.set_fact:
    active_sessions: >-
      {{ (lookup('ansible.builtin.url', netbox_url ~ '/api/plugins/bgp/session/?limit=100&status=active&device=' ~ inventory_hostname,
                 validate_certs=false, split_lines=false,
                 headers={'Authorization': 'Token ' ~ netbox_token, 'Accept': 'application/json'})
          | from_json).results }}
    other_loopbacks: >-
      {{ ansible_play_hosts_all | difference([inventory_hostname])
         | map('extract', hostvars, 'interfaces') | flatten
         | selectattr('name', 'equalto', 'Loopback0') | map(attribute='ip_addresses') | flatten
         | map(attribute='address') | map('ansible.utils.ipaddr', 'address') | list }}

- name: Check the device (Arista)
  ansible.builtin.include_tasks: eos.yml
  when: ansible_network_os == 'arista.eos.eos'

- name: Check the device (Cisco)
  ansible.builtin.include_tasks: ios.yml
  when: ansible_network_os == 'cisco.ios.ios'
