---
# Job Template: NetLab - Install NetBox
# Purpose: Runs NetBox (netbox-docker) on the NetBox EC2 instance, creates the
#          admin user and the API token AAP uses, and checks AAP -> NetBox.
#
# Required AAP Credential: "NetBox API" type, which injects
#   netbox_url, netbox_token, netbox_admin_password

- name: NetLab — install NetBox
  hosts: role_netbox
  become: true

  vars_files:
    - ../vars/netlab.yml

  vars:
    netbox_docker_version: "3.3.0"     # netbox-docker release (ships NetBox 4.3)
    netbox_base_image: netboxcommunity/netbox:v4.3-3.3.0
    netbox_docker_dir: /opt/netbox-docker
    netbox_port: 8000
    # Plugins baked into a local image on top of the official one. Versions
    # must match the NetBox release (netbox-bgp 0.16.x <-> NetBox 4.3.x).
    netbox_plugins:
      - package: netbox-bgp==0.16.1
        module: netbox_bgp

  tasks:

    - name: Install Docker
      ansible.builtin.include_tasks: tasks/docker.yml

    - name: Fetch netbox-docker
      ansible.builtin.git:
        repo: https://github.com/netbox-community/netbox-docker.git
        dest: "{{ netbox_docker_dir }}"
        version: "{{ netbox_docker_version }}"
        force: false

    # --------------------------------------------------------------- plugins
    - name: List plugin packages
      ansible.builtin.copy:
        dest: "{{ netbox_docker_dir }}/plugin_requirements.txt"
        mode: "0644"
        content: |
          {% for plugin in netbox_plugins %}
          {{ plugin.package }}
          {% endfor %}

    - name: Define the NetBox image with plugins
      ansible.builtin.copy:
        dest: "{{ netbox_docker_dir }}/Dockerfile-Plugins"
        mode: "0644"
        content: |
          FROM {{ netbox_base_image }}
          COPY ./plugin_requirements.txt /opt/netbox/
          RUN /usr/local/bin/uv pip install --python /opt/netbox/venv/bin/python -r /opt/netbox/plugin_requirements.txt

    - name: Enable plugins in NetBox
      ansible.builtin.copy:
        dest: "{{ netbox_docker_dir }}/configuration/plugins.py"
        mode: "0644"
        content: |
          # Managed by Ansible (04_install_netbox.yml)
          PLUGINS = {{ netbox_plugins | map(attribute='module') | list | to_json }}
          PLUGINS_CONFIG = {}

    - name: Run NetBox from the plugin image and expose it on the host
      ansible.builtin.copy:
        dest: "{{ netbox_docker_dir }}/docker-compose.override.yml"
        mode: "0644"
        content: |
          services:
            netbox:
              image: netbox:with-plugins
              pull_policy: never
              build:
                context: .
                dockerfile: Dockerfile-Plugins
              ports:
                - "{{ netbox_port }}:8080"
            netbox-worker:
              image: netbox:with-plugins
              pull_policy: never
            netbox-housekeeping:
              image: netbox:with-plugins
              pull_policy: never

    - name: Build the NetBox plugin image
      ansible.builtin.command: docker compose build netbox
      args:
        chdir: "{{ netbox_docker_dir }}"
      register: plugin_build
      changed_when: "'CACHED' not in plugin_build.stderr or 'naming to' in plugin_build.stderr"

    # First start runs all migrations, which outlasts the container healthcheck
    # on small instances; start netbox alone, wait for its API, then the rest
    # (the workers depend on netbox being healthy).
    - name: Start NetBox web service (first start pulls images and runs migrations)
      ansible.builtin.command: docker compose up -d netbox
      args:
        chdir: "{{ netbox_docker_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

    # netbox-docker sets LOGIN_REQUIRED, so /api/status/ is 403 until we have a
    # token; /login/ answers 200 as soon as the app is serving.
    - name: Wait for NetBox web app (migrations finished)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netbox_port }}/login/"
      register: nb_first_start
      until: nb_first_start.status == 200
      retries: 120
      delay: 10

    # After an image rebuild the web container can take a minute to pass its
    # healthcheck, which the workers depend on; retry rather than fail.
    - name: Start remaining NetBox services
      ansible.builtin.command: docker compose up -d --wait
      args:
        chdir: "{{ netbox_docker_dir }}"
      register: compose_up_all
      changed_when: "'Started' in compose_up_all.stderr or 'Recreated' in compose_up_all.stderr"
      until: compose_up_all.rc == 0
      retries: 10
      delay: 15

    - name: Bring NetBox back after instance stop/start
      ansible.builtin.copy:
        dest: /etc/systemd/system/netbox.service
        mode: "0644"
        content: |
          [Unit]
          Description=NetBox (netbox-docker)
          After=docker.service network-online.target
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=true
          WorkingDirectory={{ netbox_docker_dir }}
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose stop

          [Install]
          WantedBy=multi-user.target

    - name: Enable NetBox unit
      ansible.builtin.systemd_service:
        name: netbox
        enabled: true
        daemon_reload: true

    - name: Wait for NetBox web app
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netbox_port }}/login/"
      register: nb_ready
      until: nb_ready.status == 200
      retries: 60
      delay: 10

    - name: Ensure admin user and AAP API token
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T
          -e NB_PASSWORD -e NB_TOKEN
          netbox /opt/netbox/netbox/manage.py shell -c "import os;
          from django.contrib.auth import get_user_model;
          from users.models import Token;
          u, _ = get_user_model().objects.get_or_create(username='admin');
          u.is_superuser = True; u.is_staff = True; u.is_active = True;
          u.set_password(os.environ['NB_PASSWORD']); u.save();
          t, created = Token.objects.get_or_create(user=u, key=os.environ['NB_TOKEN'], defaults={'description': 'AAP'});
          print('token-created' if created else 'token-exists')"
        chdir: "{{ netbox_docker_dir }}"
      environment:
        NB_PASSWORD: "{{ netbox_admin_password }}"
        NB_TOKEN: "{{ netbox_token }}"
      register: nb_admin
      changed_when: "'token-created' in nb_admin.stdout"
      no_log: true

    - name: Read NetBox status with the AAP token
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ netbox_port }}/api/status/"
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: application/json
      register: nb_status

    - name: Show NetBox version
      ansible.builtin.debug:
        msg: "NetBox {{ nb_status.json['netbox-version'] }} is up"


- name: NetLab — verify AAP can reach NetBox
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Call NetBox API from the AAP execution node with the AAP token
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/users/tokens/"
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: application/json
      register: nb_check
      until: nb_check.status == 200
      retries: 12
      delay: 10

    - name: Check the BGP plugin API is served
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/plugins/bgp/session/?limit=1"
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: application/json
      register: bgp_plugin

    - name: Print NetBox summary
      ansible.builtin.debug:
        msg: "AAP -> {{ netbox_url }} OK (authenticated); BGP plugin OK ({{ bgp_plugin.json.count }} sessions)"
