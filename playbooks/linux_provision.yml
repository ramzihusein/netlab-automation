---
# Job Template: Linux - Provision / Start Servers
# Purpose: Builds (or starts, if stopped) the Linux demo servers the
#          ServiceNow CMDB lists, in the AAP VPC, and publishes their DNS
#          names. The standard fleet:
#            web1  RHEL 9         web server
#            web2  Ubuntu 24.04   web server (same playbooks, other distro)
#            db1   RHEL 9         database server
#          The CMDB owns the list (Linux - Request Server in CMDB): a new
#          record (Pending Install) gets built, a Retired one gets removed,
#          and every built server's IP and instance ID go back into its
#          record, which marks it Installed. Inventory "Linux Servers" reads
#          the Installed records. A rebuild keeps the same records.
#          With rebuild=yes (survey) the old servers are terminated first,
#          for a clean demo with a real patch backlog.
#          Without a ServiceNow credential it builds vars/linux/servers.yml.
#
# Required AAP Credentials: "AWS Creds", "NetLab ServiceNow"
# Required AAP Variables (set in Job Template): same as NetLab - Provision Infra
#   vpc_id, subnet_id, key_pair_name, aap_security_group_ids, route53_zone_id,
#   admin_cidrs

- name: Linux demo servers — AWS
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/netlab.yml
    - ../vars/linux/servers.yml

  vars:
    rebuild: "no"
    instance_type: t3.small
    ubuntu_ami_param: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    use_cmdb: "{{ lookup('env', 'SN_HOST') | length > 0 }}"
    common_tags:
      Project: netlab-linux
      ManagedBy: ansible
      # Stopped with AAP every evening by the AWS power schedule; this job
      # starts them again.
      PowerSchedule: stop-only

  tasks:

    - name: Read the servers from the CMDB
      when: use_cmdb
      block:
        - name: Our server records
          servicenow.itsm.configuration_item_info:
            sys_class_name: "{{ cmdb_server_class }}"
            sysparm_query: "short_description={{ cmdb_server_marker }}"
          register: cmdb

        - name: Servers the CMDB wants (everything not Retired)
          ansible.builtin.set_fact:
            servers: "{{ servers | default([]) + [{'name': item.name, 'os': os_by_version.get(item.os_version, item.os_version),
                                                   'role': item.subcategory, 'sys_id': item.sys_id}] }}"
          loop: "{{ cmdb.records | rejectattr('install_status', 'equalto', 'retired') | list }}"
          loop_control:
            label: "{{ item.name }} ({{ item.os_version }}, {{ item.subcategory }}, {{ item.install_status }})"
          vars:
            # "RHEL 9" -> rhel, "Ubuntu 24.04" -> ubuntu
            os_by_version: "{{ dict(cmdb_os.values() | map(attribute='os_version') | zip(cmdb_os.keys())) }}"

        - name: Servers the CMDB has retired
          ansible.builtin.set_fact:
            servers: "{{ servers | default([]) }}"
            retired: "{{ cmdb.records | selectattr('install_status', 'equalto', 'retired') | list }}"

    - name: Without ServiceNow, build the standard fleet
      ansible.builtin.set_fact:
        servers: "{{ standard_servers }}"
        retired: []
      when: not use_cmdb

    - name: Check the server list
      ansible.builtin.assert:
        that:
          - servers | length > 0
          - servers | rejectattr('os', 'in', cmdb_os) | list | length == 0
        fail_msg: >-
          {{ 'The CMDB lists no NetLab servers: run Linux - Request Server in CMDB first.'
             if servers | length == 0 else
             'Unknown OS on ' ~ (servers | rejectattr('os', 'in', cmdb_os) | map(attribute='name') | join(', '))
             ~ ': the CMDB OS Version must be one of '
             ~ (cmdb_os.values() | map(attribute='os_version') | join(', ')) }}
        quiet: true

    - name: Find the newest RHEL 9 image (Red Hat's own, pay-as-you-go)
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: ["309956199498"]
        filters:
          name: RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP3
          state: available
      register: rhel_images

    - name: Pick the images
      ansible.builtin.set_fact:
        images:
          rhel: "{{ (rhel_images.images | sort(attribute='name') | last).image_id }}"
          ubuntu: "{{ lookup('amazon.aws.ssm_parameter', ubuntu_ami_param, region=aws_region) }}"

    - name: Security group (SSH from AAP and admins, HTTP to look at the web servers)
      amazon.aws.ec2_security_group:
        name: netlab-linux-sg
        description: Linux demo servers
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules: >-
          {{
            [{'proto': 'tcp', 'ports': [22, 80], 'cidr_ip': admin_cidrs, 'rule_desc': 'admin'}]
            + (aap_security_group_ids | map('regex_replace', '^', '{"proto": "tcp", "ports": [22, 80], "rule_desc": "AAP", "group_id": "') | map('regex_replace', '$', '"}') | map('from_json') | list)
          }}
        tags: "{{ common_tags | combine({'Name': 'netlab-linux-sg'}) }}"
      register: linux_sg

    - name: Find servers the CMDB no longer lists (retired or deleted)
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": netlab-linux
          instance-state-name: [pending, running, stopping, stopped]
      register: existing

    - name: Remove them
      when: leftovers | length > 0
      vars:
        leftovers: "{{ existing.instances | rejectattr('tags.Name', 'in', servers | map(attribute='name') | list) | list }}"
      block:
        - name: Terminate
          amazon.aws.ec2_instance:
            region: "{{ aws_region }}"
            instance_ids: "{{ leftovers | map(attribute='instance_id') | list }}"
            state: absent
            wait: true

        - name: Look up their DNS names
          amazon.aws.route53:
            hosted_zone_id: "{{ route53_zone_id }}"
            record: "{{ item.tags.Name }}.{{ dns_zone }}"
            type: A
            state: get
          loop: "{{ leftovers }}"
          loop_control:
            label: "{{ item.tags.Name }}.{{ dns_zone }}"
          register: old_dns

        - name: Delete their DNS names
          amazon.aws.route53:
            hosted_zone_id: "{{ route53_zone_id }}"
            record: "{{ item.set.record }}"
            type: A
            ttl: "{{ item.set.ttl }}"
            value: "{{ item.set['values'] }}"
            state: absent
          loop: "{{ old_dns.results | selectattr('set.record', 'defined') | list }}"
          loop_control:
            label: "{{ item.set.record | default('') }}"

    - name: Terminate the old servers (rebuild)
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": netlab-linux
          instance-state-name: [pending, running, stopping, stopped]
        state: absent
        wait: true
      when: rebuild | bool

    - name: Launch or start the servers
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ images[item.os] }}"
        key_name: "{{ key_pair_name }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_groups: ["{{ linux_sg.group_id }}"]
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/sda1      # root disk on both images
            ebs:
              volume_size: 20
              volume_type: gp3
              delete_on_termination: true
              encrypted: true
        filters:
          "tag:Name": "{{ item.name }}"
          "tag:Project": netlab-linux
          instance-state-name: [pending, running, stopping, stopped]
        tags: "{{ common_tags | combine({'Role': item.role, 'OS': item.os}) }}"
        wait: true
        state: running
      loop: "{{ servers }}"
      loop_control:
        label: "{{ item.name }} ({{ item.os }}, {{ item.role }})"
      register: launched

    - name: Re-read the servers for their final addresses
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": netlab-linux
          instance-state-name: running
      register: running

    - name: Publish DNS names (<name>.{{ dns_zone }})
      amazon.aws.route53:
        hosted_zone_id: "{{ route53_zone_id }}"
        record: "{{ item.tags.Name }}.{{ dns_zone }}"
        type: A
        ttl: 60
        value: "{{ item.public_ip_address }}"
        overwrite: true
        state: present
      loop: "{{ running.instances }}"
      loop_control:
        label: "{{ item.tags.Name }}.{{ dns_zone }} -> {{ item.public_ip_address }}"

    - name: Wait for SSH (from the AAP execution node)
      ansible.builtin.wait_for:
        host: "{{ item.private_ip_address }}"
        port: 22
        delay: 5
        timeout: 600
      loop: "{{ running.instances }}"
      loop_control:
        label: "{{ item.tags.Name }}"

    - name: Write the build back to the CMDB (Installed, IP, instance ID)
      servicenow.itsm.configuration_item:
        sys_id: "{{ server.sys_id }}"
        sys_class_name: "{{ cmdb_server_class }}"
        ip_address: "{{ item.private_ip_address }}"
        install_status: installed
        operational_status: operational
        other:
          host_name: "{{ item.tags.Name }}"
          fqdn: "{{ item.tags.Name }}.{{ dns_zone }}"
          object_id: "{{ item.instance_id }}"
      vars:
        server: "{{ servers | selectattr('name', 'equalto', item.tags.Name) | first }}"
      loop: "{{ running.instances }}"
      loop_control:
        label: "{{ item.tags.Name }} -> {{ item.private_ip_address }}"
      when: use_cmdb

    - name: Mark retired servers' records as gone
      servicenow.itsm.configuration_item:
        sys_id: "{{ item.sys_id }}"
        sys_class_name: "{{ cmdb_server_class }}"
        operational_status: retired
        ip_address: ""
        other:
          object_id: ""
      loop: "{{ retired }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "ssh {{ 'ec2-user' if item.tags.OS == 'rhel' else 'ubuntu' }}@{{ item.tags.Name }}.{{ dns_zone }}  ({{ item.tags.OS }}, {{ item.tags.Role }}, {{ item.private_ip_address }})"
      loop: "{{ running.instances | sort(attribute='tags.Name') }}"
      loop_control:
        label: "{{ item.tags.Name }}"
