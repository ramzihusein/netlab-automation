---
# Rulebook activation: "NetLab NetBox Changes"
# The webhook source below is replaced at activation time by the AAP event
# stream "NetLab NetBox" (source mapping), which NetBox posts to.
#
# NetBox webhook body: {event, model, timestamp, username, request_id, data, snapshots}
# Each rule runs "NetLab - Configure Devices" limited to the affected device.

- name: NetBox intent changes
  hosts: all
  sources:
    - name: netbox_webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # AAP writes to NetBox as user "aap" (Populate, the VLAN request
    # workflow), and whatever made that change also pushes it. Only react to
    # people's edits, so a change is never pushed twice.
    - name: Change made by AAP
      condition: event.payload.username == "aap"
      action:
        debug:
          msg: "{{ event.payload.model }} changed by AAP itself, nothing to do"

    # Device-scoped changes: the playbook configures this device plus its
    # cabled BGP neighbors (worked out from NetBox), so pass the device name.
    - name: Device created or updated
      condition: >-
        event.payload.model == "device"
        and event.payload.event in ["created", "updated"]
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            extra_vars:
              changed_device: "{{ event.payload.data.name }}"

    - name: Interface changed
      condition: >-
        event.payload.model == "interface"
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            extra_vars:
              changed_device: "{{ event.payload.data.device.name }}"

    - name: Interface IP address changed
      condition: >-
        event.payload.model == "ipaddress"
        and event.payload.data.assigned_object_type == "dcim.interface"
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            extra_vars:
              changed_device: "{{ event.payload.data.assigned_object.device.name }}"

    - name: BGP session changed
      condition: >-
        event.payload.model == "bgpsession"
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            extra_vars:
              changed_device: "{{ event.payload.data.device.name }}"

    # Policy (config contexts), VLANs and ASNs apply to many devices: configure all.
    - name: Policy, VLAN or ASN changed
      condition: >-
        event.payload.model in ["configcontext", "vlan", "asn"]
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
