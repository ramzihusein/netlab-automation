---
# Rulebook activation: "NetLab Self-Heal"
# The webhook source below is replaced at activation time by the AAP event
# stream "NetLab Device Syslog", which the lab host's syslog forwarder posts
# to (scripts/syslog_to_eda.py).
#
# Event: {device, source_ip, message}, where message is the device's
#   %SYS-5-CONFIG_I: Configured from console by admin on vty3 (172.20.20.1)
#
# Someone changed a device by hand -> put it back the way NetBox says, with a
# ServiceNow incident opened, then resolved (or escalated if the fix fails),
# and each step posted to the team's Mattermost channel.

- name: Self-heal out-of-band changes
  hosts: all
  # Heal devices side by side rather than one job after another.
  execution_strategy: parallel
  sources:
    - name: device_syslog
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # A config change that didn't come from AAP: AAP's own pushes log one too,
    # but from the AAP nodes (10.0.x.x), so those are left alone.
    # A device logs one message per config session; if more arrive for the
    # same device within a minute, they're covered by the job already running.
    - name: Change made by hand
      condition: >-
        event.payload.message is search("SYS-5-CONFIG", ignorecase=true)
        and event.payload.message is not search("[(]10[.]0[.]", ignorecase=true)
      throttle:
        once_within: 60 seconds
        group_by_attributes:
          - event.payload.device
      action:
        run_workflow_template:
          name: NetLab - Self-Heal with Incident
          organization: Default
          job_args:
            limit: "{{ event.payload.device }}"
