---
# Rulebook activation: "NetLab NetBox Changes (AWS SQS)"
# Same rules as netbox_events.yml, but events arrive via
#   NetBox -> API Gateway (HMAC check) -> EventBridge -> SQS FIFO (this source)
# The EventBridge rule delivers NetBox's own webhook body, so the only
# difference from the direct path is event.body instead of event.payload.
# Queue credentials come from the EDA credential "NetLab SQS Reader".
#
# Only one path is fed at a time: the "NetLab - Configure NetBox Webhook" job
# points NetBox's single webhook at either the event stream or AWS.

- name: NetBox intent changes via AWS
  hosts: all
  sources:
    - name: netbox_sqs
      ansible.eda.aws_sqs_queue:
        name: netlab-netbox-events-eda.fifo
        region: us-east-2
        access_key: "{{ sqs_access_key }}"
        secret_key: "{{ sqs_secret_key }}"
        delay_seconds: 2

  rules:
    - name: Device created or updated
      condition: >-
        event.body.model == "device"
        and event.body.event in ["created", "updated"]
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            limit: "{{ event.body.data.name }}"

    - name: Interface changed
      condition: >-
        event.body.model == "interface"
        and event.body.event in ["created", "updated"]
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            limit: "{{ event.body.data.device.name }}"

    - name: Interface IP address changed
      condition: >-
        event.body.model == "ipaddress"
        and event.body.data.assigned_object_type == "dcim.interface"
      action:
        run_job_template:
          name: NetLab - Configure Devices
          organization: Default
          job_args:
            limit: "{{ event.body.data.assigned_object.device.name }}"
